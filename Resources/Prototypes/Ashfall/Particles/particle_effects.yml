  lifetime: 0.25
  lifetimeVariance: 0.15
  speed: 3.0
  speedVariance: 2.0
  particleSize: 0.6
  stretchFactor: 0.4
  maxCount: 15
  burst: true
  spreadAngle: 360
  shape:
    type: Point

- type: particleEffect
  id: AshfallFireContinuous
  sprite:
    sprite: Ashfall/Particles/generic.rsi
    state: dot
  shader: unshaded
  colorOverLifetime:
    - time: 0.0
      color: "#FCE6B6FF"
    - time: 0.2
      color: "#FBAF4DFF"
    - time: 0.5
      color: "#FD6B1CFF"
    - time: 0.8
      color: "#CC220088"
    - time: 1.0
      color: "#40000000"
  alphaOverLifetime:
    - time: 0.0
      value: 0.0
    - time: 0.05
      value: 1.0
    - time: 0.7
      value: 1.0
    - time: 1.0
      value: 0.0
  emissionRate: 14
  maxCount: 80
  particleSize: 0.7
  burst: false
  duration: 0
  gravity: -0.8
  drag: 0.1
  noiseStrength: 0.2
  noiseFrequency: 1.0
  spreadAngle: 50
  emitAngle: 0
  shape:
    type: CircleFill
    radius: 0.25

