- type: particleEffect
  id: AshfallWeldingSparks
  sprite:
    sprite: Ashfall/Particles/generic.rsi
    state: curl
  shader: unshaded
  colorOverLifetime:
    - time: 0.0
      color: "#FFFFFFFF"
    - time: 0.1
      color: "#FFEE88FF"
    - time: 0.5
      color: "#FF8800BB"
    - time: 1.0
      color: "#FF220000"
  lifetime: 0.3
  lifetimeVariance: 0.25
  speed: 2.5
  speedVariance: 1.5
  particleSize: 0.8
  stretchFactor: 0.5
  emissionRate: 20
  maxCount: 30
  burst: false
  duration: 0
  gravity: 5.0
  drag: 0.02
  spreadAngle: 90
  emitAngle: 0
  shape:
    type: CircleFill
    radius: 0.1

- type: particleEffect
  id: AshfallMuzzleSmoke
  sprite:
    sprite: Ashfall/Particles/smoke.rsi
    state: smoke
  alphaOverLifetime:
    - time: 0
      value: 0.35
    - time: 0.8
      value: 0
  sizeOverLifetime:
    - time: 0
      value: 0.5
    - time: 0.8
      value: 1.6
  startColor: "#DDDDDD"
  lifetime: 0.8
  lifetimeVariance: 0.1
  speed: 6
  speedVariance: 4
  particleSize: 0.7
  sizeVariance: 0.2
  stretchFactor: 0
  maxCount: 6
  burst: true
  duration: 1
  gravity: 0
  drag: 4
  spreadAngle: 25
  emitAngle: 0
  startRotationVariance: 180
  rotationSpeed: 20
  rotationSpeedVariance: 20
  inheritVelocity: 0.8
  shape:
    type: Point

- type: particleEffect
  id: AshfallSparks
  sprite:
    sprite: Ashfall/Particles/generic.rsi
    state: cross
