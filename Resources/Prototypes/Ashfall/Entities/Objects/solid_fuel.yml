# Shared solid fuel combustion profiles
- type: entity
  id: BaseSolidFuel
  abstract: true
  components:
  - type: SolidFuel
    ignitionTime: 25
    burnTime: 60
    coolingRate: 2
  - type: Flammable
    alwaysCombustible: true
    fireSpread: false
    firestackFade: 0
    damage: {}
  - type: Appearance
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: "1"
    alternateState: "2"
    fireStackAlternateState: 1
    lightRadiusPerStack: 1.5
    lightEnergyPerStack: 1.2
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]

- type: entity
  id: BaseWoodFuel
  parent: BaseSolidFuel
  abstract: true
  components:
  - type: SolidFuel
    ignitionTime: 25
    burnTime: 120

- type: entity
  id: BaseCarpetFuel
  parent: BaseSolidFuel
  abstract: true
  components:
  - type: SolidFuel
    ignitionTime: 15
    burnTime: 90

# Invisible until ignited. Created for floor tiles currently exposed to heat.
- type: entity
  id: SolidFuelFloorWood
  parent: BaseWoodFuel
  name: burning wooden floor
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    noRot: true
    drawdepth: Effects
  - type: PointLight
    radius: 3.5
    energy: 1.5
    color: "#FFAA44"
    castShadows: false
  - type: Transform
    anchored: true

- type: entity
  id: SolidFuelFloorCarpet
  parent: SolidFuelFloorWood
  name: burning carpet floor
  components:
  - type: SolidFuel
    ignitionTime: 15
    burnTime: 90
