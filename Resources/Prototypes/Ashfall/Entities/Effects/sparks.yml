- type: entity
  id: AshfallEffectSparks
  parent: EffectSparks
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/sparks.rsi
    layers:
    - state: sparks
      shader: unshaded
    drawdepth: Effects
    noRot: true
    loop: false
  - type: Physics
    bodyType: Dynamic
    bodyStatus: InAir
    sleepingAllowed: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        hard: true
        restitution: 0.0
        density: 100
        mask:
        - Impassable
  - type: TimedDespawn
    lifetime: 0.8
  - type: EmitSoundOnSpawn
    positional: true
    sound:
      collection: sparks
      params:
        variation: 0.250
  - type: PointLight
    radius: 1.5
    energy: 3
    falloff: 6
    color: "#FAA019"
    netsync: false
  - type: IgnitionSource
    ignited: true
  - type: Tag
    tags:
    - HideContextMenu
