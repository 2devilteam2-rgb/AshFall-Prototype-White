author: wzzker21
changes:
  - type: Add
    message: Добавлены баллистические трассеры выстрелов для пуль.
  - type: Add
    message: Добавлены процедурные анимации эмоций (сальто, прыжок, вращение, дрожь, виляние хвостом).
  - type: Add
    message: Добавлен эффект ударной волны и преломления света при взрывах.
  - type: Add
    message: Добавлены адреналиновые шлейфы движения и хроматический спектр восприятия при ускорении.
  - type: Add
    message: Добавлен аутентичный рунчат в стиле SS13 с пиксельным шрифтом Cozette, 12-проходной обводкой, плавным всплытием и настройкой масштаба в меню.
  - type: Tweak
    message: Добавлено динамическое форматирование рунчата: паузы и запинки (.. и ...) окрашиваются в серый оттенок, а крики (!!!) выделяются крупным шрифтом и панической тряской.
  - type: Tweak
    message: Увеличено время отображения реплик над головой для более комфортного чтения диалогов.
  - type: Tweak
    message: Переработано окно настроек: добавлен удобный сайдбар по категориям, выделена отдельная вкладка «Чат и речь», стандартизированы размеры выпадающих списков и ползунков под русский язык.
  - type: Tweak
    message: Ползунок громкости эмбиента теперь также регулирует громкость звуков погоды.
  - type: Tweak
    message: Оптимизирована производительность клиента: отрисовка трассеров переведена на O(1) учет дистанции, исключены лишние переборы света и аллокации в оверлеях частиц и конуса обзора.
  - type: Tweak
    message: Обновлен шейдер ПНВ: улучшена видимость во тьме, убраны ослепляющие засветы.
  - type: Tweak
    message: Обновлены речевые бабблы: речь скрытых персонажей становится полупрозрачной, клики мыши больше не блокируются бабблами.
  - type: Tweak
    message: Добавлено локальное предсказание движения спрайтов для более отзывчивого управления.
  - type: Fix
    message: Исправлена работа шлемов с защитой от контузии (ConcussionProtectionComponent).
  - type: Fix
    message: Разделены таблицы спавна мыла для предотвращения абузов поставок в карго и пояса уборщика.
  - type: Fix
    message: Исправлено падение и ошибки модификации коллекции при расчленении (гиббинге) тела.
  - type: Fix
    message: Исправлена активация шейдеров в оверлеях агонии и адреналинового зрения.
  - type: Fix
    message: Исправлено вращение взгляда при блокировке перемещения персонажа.
  - type: Fix
    message: Исправлено слежение камеры при посадке в транспорт и выходе из него.
  - type: Fix
    message: Исправлен дюп предметов при переработке некоторых продуктов питания.
  - type: Fix
    message: Исправлена подсветка MMI и позитронных мозгов в темноте.
  - type: Remove
    message: Черта «Пацифист» удалена из пула генерации персонажа и списка доступных квирков.
